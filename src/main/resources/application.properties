spring.application.name=reverse-marketplace-backend
server.port=${PORT:8080}

# MySQL Database Configuration
# Uses environment variables with beginner-friendly local defaults.
# 'createDatabaseIfNotExist=true' automatically creates the database if it is missing!
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reverse_marketplace?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
# 'update': Hibernate inspects entities and automatically creates or updates MySQL tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (256-bit secure key)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Token validity: 24 hours (86,400,000 milliseconds)
app.jwt.expiration-ms=86400000

# CORS Allowed Origins (Comma separated list)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
